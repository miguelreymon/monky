<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Monky Estatuas · Monkyplay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--y:#ffd23f;--l:#c9b3ff;--g:#b8f0c0;--r:#ff8fa3;--b:#9ad0ff;--k:#111}
html,body{height:100%;overflow:hidden;background-color:#fff6e0;font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-weight:800;color:var(--k);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{background-image:radial-gradient(circle at 0 0,var(--y) 0 12vmin,transparent calc(12vmin + 1px)),radial-gradient(circle at 100% 6%,var(--r) 0 11vmin,transparent calc(11vmin + 1px)),radial-gradient(circle at 100% 100%,var(--g) 0 18vmin,transparent calc(18vmin + 1px)),radial-gradient(circle at 6% 100%,var(--l) 0 15vmin,transparent calc(15vmin + 1px))}
#st{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;font-size:44px}#st>*{position:absolute}
h1{font-size:76px;line-height:1}h2{font-size:44px;margin:6px 0 10px}p{font-size:30px}
.card{background:#fffdf5;border:5px solid var(--k);border-radius:36px;box-shadow:0 8px 0 rgba(17,17,17,.9)}
.bub{background:#fffdf5;border:4px solid var(--k);border-radius:60px;text-align:center}
.btn{font:inherit;font-weight:900;border:5px solid var(--k);border-radius:999px;background:var(--y);color:var(--k);padding:.4em 1em;cursor:pointer;box-shadow:0 7px 0 var(--k);transition:transform .08s,box-shadow .08s;font-size:38px}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--k)}.btn:disabled{opacity:.4;pointer-events:none}.btn.alt{background:var(--l)}.btn.ok{background:var(--g)}.btn.sel{background:var(--g)}
.lg{left:28px;top:18px;width:380px}
.tb{left:560px;top:25px;width:900px;height:205px;display:flex;align-items:center;padding:0 40px}#st img{display:block;width:100%;pointer-events:none}#st .tb img{width:150px;flex:none;margin-right:20px}
.rp{right:45px;top:45px;width:420px;height:130px;display:flex;align-items:center;justify-content:center;font-size:46px;text-align:center;line-height:1.1}
.row{display:flex;align-items:center;margin-bottom:8px;font-size:34px}.row>*{margin-right:14px}.row>*:last-child{margin-right:0}.row input{flex:1;font:inherit;font-weight:800;font-size:34px;border:4px solid var(--k);border-radius:20px;padding:6px 14px;background:#fff;min-width:0}
.av{display:inline-flex;align-items:center;justify-content:center;width:66px;height:66px;border:4px solid var(--k);border-radius:50%;font-size:38px;background:var(--y);flex:none}
.tag,.x{font:inherit;font-weight:800;border:4px solid var(--k);border-radius:999px;padding:4px 16px;font-size:26px;cursor:pointer}.x{background:var(--r);padding:4px 14px}.x:disabled{opacity:.3}
.col{right:45px;top:225px;width:540px;display:flex;flex-direction:column}.col>*{margin-bottom:7px}
.pc{display:flex;align-items:center;background:#fffdf5;border:4px solid var(--k);border-radius:999px;padding:5px 24px 5px 8px;font-size:32px;line-height:1.05;box-shadow:0 5px 0 rgba(17,17,17,.85);cursor:pointer}.pc>*{margin-right:14px}.pc>.k{margin-right:0}.pc small{display:block;font-size:23px;color:#444}.pc.mv{background:var(--r)}.pc .k{margin-left:auto;font-size:24px;background:var(--y);border:3px solid var(--k);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.btn:focus,.pc:focus,.tag:focus,.x:focus,input:focus{outline:6px solid #111;outline-offset:5px}.sticker{background:var(--y);border:8px solid var(--k);border-radius:24px;padding:.05em .4em;font-weight:900;transform:rotate(-4deg);box-shadow:0 10px 0 var(--k);animation:popr .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0);opacity:0}}@keyframes popr{from{transform:scale(0) rotate(-4deg);opacity:0}}@keyframes dance{0%,100%{transform:translateY(0) rotate(-6deg)}25%{transform:translateY(-40px) rotate(0)}50%{transform:translateY(0) rotate(6deg)}75%{transform:translateY(-40px) rotate(0)}}
@keyframes fl{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),-420px);opacity:0}}@keyframes shiv{50%{transform:translateX(3px)}}.ice{animation:shiv .2s linear infinite;will-change:transform;background:radial-gradient(closest-side,rgba(127,211,255,.5),rgba(127,211,255,0))}.ice+.fl{font-size:70px}@keyframes tick{50%{transform:scale(1.15)}}
.dn{animation:dance .94s ease-in-out infinite;will-change:transform}.fz{animation:pop .4s both;filter:drop-shadow(0 0 20px #9ad0ff)}.nt{font-size:90px;animation:fl 2.4s linear infinite;will-change:transform,opacity}
.cf{position:fixed;top:-24px;width:14px;height:20px;z-index:99;pointer-events:none;border:2px solid #111;animation:fall linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
#mu{position:fixed;right:10px;bottom:10px;z-index:50;width:56px;height:56px;padding:0;font-size:28px}
.pod{display:flex;align-items:flex-end;justify-content:center}.pod>*{margin:0 10px}.pcol{width:300px;text-align:center}.blk{border:6px solid var(--k);border-radius:28px 28px 0 0;font-size:110px;font-weight:900;display:flex;align-items:flex-start;justify-content:center;padding-top:10px}

const head=t=>`<div class="lg"><img src="${IMG.l}" alt="monkyplay"></div><div class="bub tb">${spr('c')}<div><h1>Monky Estatuas</h1><p>${t}</p></div></div>`;
function add(){if(P().length<8){P().push({n:'Jugador '+(P().length+1),t:P().length%2});SFX.pop();render()}}
function rm(i){if(P().length>2){P().splice(i,1);SFX.pop();render()}}
function tg(i){P()[i].t^=1;SFX.pop();render()}
function setn(v){G.autoNext=v;SFX.pop();render()}function setm(m){G.mode=m;SFX.pop();render()}function setr(n){G.rounds=n;SFX.pop();render()}
function go(){ac();unlock();try{speechSynthesis.getVoices()}catch(e){}P().forEach((p,i)=>{p.pts=0;p.mv=false;if(!p.n.trim())p.n='Jugador '+(i+1)});G.deck=shuf(CH);G.round=1;G.nx=null;G.ph='ready';SFX.start();render()}
let lastD=0;function danceMs(){let d;do{const r=Math.random();d=r<.25?3000+Math.random()*3000:r<.7?7000+Math.random()*5000:13000+Math.random()*9000}while(Math.abs(d-lastD)<3000);lastD=d;return d}
function startDance(){G.nx=null;clearTimeout(T1);clearInterval(T2);P().forEach(p=>p.mv=false);G.ph='dance';musicStart();SFX.pop();render();T1=setTimeout(freeze,danceMs())}
function freeze(){clearTimeout(T1);musicStop();SFX.stat();if(!G.deck.length)G.deck=shuf(CH);G.ch=G.deck.pop();say('¡Stop! '+G.ch.t);P().forEach(p=>{p.mv=false;p.pts++});G.ph='statue';G.hold=8;render();
 T2=setInterval(()=>{let ch=false;if(G.ph==='statue'){G.hold--;if(G.hold<=3&&G.hold>0)SFX.tick();if(G.hold<=0){G.ph='judge';G.nx=G.autoNext?7:null;SFX.ok();ch=true}}else if(G.nx!=null){G.nx--;if(G.nx<=0){next();return}if(G.nx<=2)SFX.tick()}if(ch)render();else tickUI()},1000)}
function tickUI(){const c=$('#cd'),k=$('#sk');if(k&&G.ph==='statue'&&G.hold<8)k.textContent='¡ESTATUA!';if(c){if(G.ph==='statue'){c.textContent=G.hold;c.style.background=G.hold<=3?'var(--r)':''}else if(G.nx!=null)c.textContent='🎵 '+G.nx}}
function updUI(){const f=document.activeElement,L=document.querySelectorAll('.pc'),ix=f?Array.prototype.indexOf.call(L,f):-1,c=$('.col'),r=$('.rp');if(c)c.outerHTML=col();if(r)r.outerHTML=rpH();if(ix>=0){const n=document.querySelectorAll('.pc')[ix];if(n)n.focus()}}
function mv(i){const p=P()[i];if((G.ph==='statue'||G.ph==='judge')&&p){p.mv=!p.mv;p.pts+=p.mv?-1:1;p.mv?SFX.out():SFX.ok();updUI()}}
function next(){if(G.ph!=='judge'&&G.ph!=='statue')return;clearInterval(T2);G.nx=null;if(G.round>=G.rounds){G.ph='final';SFX.win();confetti();render()}else{G.round++;if(G.autoNext)startDance();else{G.ph='ready';SFX.start();render()}}}
function again(){G.ph='setup';render()}
function main(){var f=({setup:go,ready:startDance,dance:freeze,statue:next,judge:next,final:again})[G.ph];if(f)f()}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.target.classList&&e.target.classList.contains('pc')){if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}return}if(e.target.tagName==='BUTTON')return;if(e.key===' '||e.key==='Enter'){e.preventDefault();main()}else if(/^[1-8]$/.test(e.key))mv(+e.key-1);else if(/^m$/i.test(e.key))mute()});
// ---------- Pantallas ----------
const tot=t=>P().filter(p=>p.t===t).reduce((a,p)=>a+p.pts,0);
function rSetup(){return head('¡Baila, congélate y no te muevas!')+`<div class="card" style="left:50px;top:265px;width:1010px;padding:22px 26px"><h2>👨‍👩‍👧 Jugadores (${P().length}/8)</h2>${P().map((p,i)=>`<div class="row"><span class="av">${AVS[i]}</span><input value="${esc(p.n)}" maxlength="12" oninput="G.players[${i}].n=this.value">${eq()?`<button class="tag" style="background:${COL[p.t]}" onclick="tg(${i})">${TN[p.t]}</button>`:''}<button class="x" onclick="rm(${i})" ${P().length<=2?'disabled':''}>✖</button></div>`).join('')}<button class="btn alt" onclick="add()" style="font-size:32px;margin-top:6px" ${P().length>=8?'disabled':''}>＋ Añadir jugador</button></div>
<div class="card" style="left:1110px;top:265px;width:760px;padding:22px 26px"><h2>Modo</h2><button class="btn ${eq()?'':'sel'}" onclick="setm('ind')">🧍 Individual</button> <button class="btn ${eq()?'sel':''}" onclick="setm('eq')">👥 Equipos</button><h2 style="margin-top:22px">Rondas</h2>${[3,5,8].map(n=>`<button class="btn ${G.rounds===n?'sel':''}" onclick="setr(${n})">${n}</button>`).join(' ')}<h2 style="margin-top:18px">Siguiente ronda</h2><button class="btn ${G.autoNext?'sel':''}" style="font-size:32px" onclick="setn(true)">🔁 Automática</button> <button class="btn ${G.autoNext?'':'sel'}" style="font-size:32px" onclick="setn(false)">✋ Manual</button><p style="margin-top:12px;font-size:24px;line-height:1.15">Los niños bailan por el salón sin móvil. <b>La familia es el jurado</b>: cuando pare la música, tocad a quien se mueva: ¡los puntos se suman solos!</p></div>
<button class="btn" onclick="go()" style="left:1110px;top:920px;width:760px;font-size:54px">▶ ¡A JUGAR!</button><div style="left:50px;top:1010px;font-size:26px">Teclado: Espacio = acción principal · 1-8 = marcar «se movió» · M = sonido</div>`}
function col(){const j=G.ph==='statue'||G.ph==='judge';return `<div class="col" style="${P().length>6?'font-size:28px':''}">${P().map((p,i)=>`<div tabindex="0" class="pc ${p.mv&&j?'mv':''}" style="${eq()?'border-color:'+COL[p.t]:''}" onclick="mv(${i})"><span class="av" style="width:62px;height:62px;font-size:34px">${AVS[i]}</span><div><b>${esc(p.n)}</b><small>⭐ ${p.pts} punto${p.pts==1?'':'s'}${j?(p.mv?' · 😅 se movió: sin punto':' · ✅ +1'):''}</small></div><span class="k">${i+1}</span></div>`).join('')}</div>`}
const rpH=()=>eq()?`<div class="card rp" style="background:#fffdf5">🩷 ${tot(0)} · 💙 ${tot(1)}</div>`:`<div class="card rp">Ronda ${G.round}/${G.rounds}</div>`;
function rGame(){const ph=G.ph,t={ready:`Ronda ${G.round} de ${G.rounds} · ¡Preparaos!`,dance:'🎶 ¡A bailar sin parar!',statue:'¡Congelados! +1 punto para todos',judge:'👀 Jurado: tocad a quien se movió'}[ph];
 const rp=rpH();let c;
 if(ph==='statue'||ph==='judge')c=`<div id="sk" class="sticker" style="left:150px;top:270px;font-size:128px">${G.hold>=8&&ph==='statue'?'¡STOP!':'¡ESTATUA!'}</div><div class="ice" style="left:880px;top:250px;width:340px">${spr('i')}</div><div class="fl" style="left:860px;top:260px">❄️</div><div class="fl" style="left:1160px;top:430px">❄️</div><div class="card" style="left:200px;top:520px;width:760px;padding:18px;text-align:center"><div style="font-size:110px;line-height:1.1">${G.ch.e}</div><div style="font-size:56px">${G.ch.t}</div></div><div id="cd" class="card" style="left:1000px;top:540px;width:260px;height:260px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:${ph==='statue'||G.nx!=null?120:40}px;${G.hold<=3&&ph==='statue'?'background:var(--r)':''}">${ph==='statue'?G.hold:G.nx!=null?'🎵 '+G.nx:'¡Podéis moveros!'}</div>`;
 else c=`<div class="${ph==='dance'?'dn':''}" style="left:330px;top:260px;width:520px;transform-origin:bottom">${spr('t')}</div>${ph==='dance'?[0,1,2,3,4].map(i=>`<div class="nt" style="left:${160+i*250}px;top:700px;--dx:${i%2?60:-60}px;animation-delay:${i*.5}s">${['♪','♫','🎵','🎶','♬'][i]}</div>`).join(''):''}<div class="bub" style="left:170px;top:660px;width:1000px;padding:16px;font-size:56px">${ph==='ready'?'Cuando todos estén listos… ¡música!':'¡Baila! Nadie sabe cuándo parará…'}</div>`;
 const b=ph==='ready'?`<button class="btn" onclick="startDance()" style="left:50px;top:880px;width:1000px;font-size:62px">🎵 EMPEZAR BAILE</button>`:ph==='dance'?`<button class="btn alt" onclick="freeze()" style="left:50px;top:900px;font-size:34px">✋ Parar ya</button>`:(ph==='judge'||ph==='statue')?`<button class="btn" onclick="next()" style="left:50px;top:880px;width:800px;font-size:48px">${G.round>=G.rounds?'🏆 VER PODIO':'➡ SIGUIENTE RONDA'}</button>${ph==='judge'&&G.nx!=null?`<button class="btn alt" onclick="G.nx=null;SFX.pop();render()" style="left:880px;top:895px;font-size:30px">⏸ Esperar</button>`:''}`:'';
 return head(t)+rp+c+col()+b+((ph==='judge'||ph==='statue')?`<div style="left:50px;top:1010px;font-size:25px">Al parar, todos suman +1. Si alguien se mueve, tocadle (o pulsad su número 1-${P().length}) y no suma esta ronda. ¡Sin castigos!${G.autoNext?' La música vuelve sola.':''}</div>`:'')}
function rFinal(){let L=eq()?[0,1].map(t=>({n:TN[t],a:'',s:tot(t),m:P().filter(p=>p.t===t).map(p=>p.n).join(', ')})):P().map((p,i)=>({n:p.n,a:AVS[i],s:p.pts,m:''}));
 L.sort((a,b)=>b.s-a.s);const top=L.slice(0,3),o=top.length>2?[1,0,2]:top.length>1?[1,0]:[0],H=[330,250,180],bg=['#ffd23f','#d9dde3','#e0a46a'],tie=L.length>1&&L[0].s===L[1].s;
 return head('¡Fin de la partida!')+`<div class="bub" style="left:300px;top:260px;width:1320px;font-size:62px;padding:10px">${tie?'🤝 ¡Empate! Todos campeones':'🏆 ¡Felicidades, '+esc(top[0].n)+'!'}</div><div class="pod" style="left:50px;top:400px;width:1250px;height:620px">${o.map(i=>`<div class="pcol"><div style="font-size:${i?72:110}px">${top[i].a||'🏅'}</div><div style="font-size:38px">${esc(top[i].n)}</div><div style="font-size:34px;line-height:1.1">${top[i].m?esc(top[i].m)+'<br>':''}⭐ ${top[i].s}</div><div class="blk" style="height:${H[i]}px;background:${bg[i]}">${i+1}</div></div>`).join('')}</div><div style="left:1330px;top:260px;width:540px;text-align:center"><div class="dn" style="width:420px;margin:0 auto">${spr('c')}</div><div style="font-size:120px">🏆</div></div>
 <button class="btn" onclick="again()" style="left:1330px;top:760px;width:540px;font-size:44px">🔄 OTRA PARTIDA</button><button class="btn alt" onclick="again()" style="left:1330px;top:890px;width:540px;font-size:36px">👥 Cambiar jugadores</button>`}
function render(){st.innerHTML=G.ph==='setup'?rSetup():G.ph==='final'?rFinal():rGame()}
render();
</script></body></html>
